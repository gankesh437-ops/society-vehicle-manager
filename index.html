function normalizeVehicleNumber(str){
  return (str||'').toUpperCase().replace(/[\s\-]/g,'');
}
function pad2(n){ n = parseInt(n,10); return n<10 ? '0'+n : ''+n; }

function getTower(code){
  return state.towers.find(t=>t.tower_code===code);
}
function buildFloors(t){
  if(!t) return [];
  if(t.tower_type === 'normal'){
    const arr=['Ground'];
    for(let i=1;i<=t.upper_floors;i++) arr.push(String(i));
    return arr;
  } else {
    const arr=['Ground'];
    for(let i=1;i<=t.core_upper_floors;i++) arr.push(String(i));
    return arr;
  }
}
function buildFlats(t, floorLabel){
  if(!t || !floorLabel) return [];
  const floorNum = floorLabel==='Ground' ? 0 : parseInt(floorLabel,10);
  const prefix = pad2(floorNum);
  const flats = [];
  if(t.tower_type === 'normal'){
    for(let k=1;k<=t.flats_per_floor;k++) flats.push(prefix+pad2(k));
  } else {
    const total = t.cores * t.flats_per_core;
    for(let k=1;k<=total;k++) flats.push(prefix+pad2(k));
  }
  return flats;
}
function findTowerFloorForFlat(flatNumber){
  // returns list of {tower, floor} that could match this flat number (ambiguous across towers)
  const matches = [];
  for(const t of state.towers){
    const floors = buildFloors(t);
    for(const f of floors){
      const flats = buildFlats(t, f);
      if(flats.includes(flatNumber)) matches.push({tower:t.tower_code, floor:f});
    }
  }
  return matches;
}

function toast(msg, type){
  type = type || 'info';
  const colors = { info:'bg-slate-800', success:'bg-emerald-600', error:'bg-rose-600' };
  const box = document.createElement('div');
  box.className = 'fade-in text-white text-sm px-4 py-2.5 rounded-xl shadow-lg '+(colors[type]||colors.info);
  box.textContent = msg;
  document.getElementById('toast-container').appendChild(box);
  setTimeout(()=>{ box.style.transition='opacity .3s'; box.style.opacity='0'; setTimeout(()=>box.remove(),300); }, 2000);
}

async function initAuth(){
  if(!supabaseClient){ state.loading=false; state.page='config'; render(); return; }
  try {
    const { data, error } = await supabaseClient.auth.getSession();
    if(error) console.warn('getSession:', error);
    state.session = data && data.session ? data.session : null;
    supabaseClient.auth.onAuthStateChange((event, session)=>{
      state.session = session;
      if(!session){ state.profile=null; state.permissions=new Set(); state.page='login'; state.loading=false; render(); }
    });
    if(state.session){ await loadUserData(); return; }
  } catch(e) {
    console.warn('Auth initialization:', e);
  }
  state.loading=false;
  try{ state.page = localStorage.getItem('svm_onboarded') ? 'login' : 'onboarding'; }catch(e){ state.page='login'; }
  render();
}
function finishOnboarding(){
  try{ localStorage.setItem('svm_onboarded','1'); }catch(e){}
  state.page='login'; render();
}

function normalizeMobile(mobile){
  let digits = (mobile||'').replace(/\D/g,'');
  // Accept +91XXXXXXXXXX / 91XXXXXXXXXX as well as a plain 10-digit number.
  if(digits.length > 10 && digits.startsWith('91')) digits = digits.slice(-10);
  return digits;
}
function mobileToSyntheticEmail(mobile){
  const digits = normalizeMobile(mobile);
  return digits + '@guard.svm.local';
}
function authFailureMessage(error, fallback){
  const raw = (error && (error.message || error.error_description || error.msg)) || '';
  const text = String(raw);
  if(/failed to fetch|network|load failed|fetch/i.test(text)) {
    return 'Internet connection या server से connection नहीं हो रहा। Internet चालू करके फिर Login करें।';
  }
  if(/invalid login credentials|invalid credentials/i.test(text)) {
    return 'Login details ग़लत हैं। Mobile/Email और Password जाँचें।';
  }
  return text || fallback;
}
async function doLogin(email, password){
  email = (email||'').trim().toLowerCase();
  if(!email || !password){ state.authError='Email और Password भरें'; render(); return; }
  if(!supabaseClient){ state.authError='Server configuration उपलब्ध नहीं है'; render(); return; }
  state.loading=true; state.authError=''; state.authMsg=''; render();
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){ state.loading=false; state.authError=authFailureMessage(error,'Email या Password ग़लत है'); render(); return; }
    if(!data || !data.session){ state.loading=false; state.authError='Login session नहीं बन सका। फिर से प्रयास करें।'; render(); return; }
    state.session = data.session;
    await loadUserData();
  } catch(e) {
    state.loading=false; state.authError=authFailureMessage(e,'Login नहीं हो पाया।'); render();
  }
}
async function doMobileLogin(mobile, password){
  const normalized = normalizeMobile(mobile);
  if(normalized.length !== 10 || !password){ state.authError='10 अंकों का Mobile Number और Password भरें'; render(); return; }
  if(!supabaseClient){ state.authError='Server configuration उपलब्ध नहीं है'; render(); return; }
  state.loading=true; state.authError=''; state.authMsg=''; render();
  try {
    const email = mobileToSyntheticEmail(normalized);
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){ state.loading=false; state.authError=authFailureMessage(error,'Mobile Number या Password ग़लत है'); render(); return; }
    if(!data || !data.session){ state.loading=false; state.authError='Login session नहीं बन सका। फिर से प्रयास करें।'; render(); return; }
    state.session = data.session;
    await loadUserData();
  } catch(e) {
    state.loading=false; state.authError=authFailureMessage(e,'Login नहीं हो पाया।'); render();
  }
}
async function doRegister(name, email, password, confirm){
  state.authError='';
  if(!name || !email || !password){ state.authError='सभी फ़ील्ड भरें'; render(); return; }
  if(password.length < 6){ state.authError='Password कम से कम 6 अक्षर का हो'; render(); return; }
  if(password !== confirm){ state.authError='Password मेल नहीं खाता'; render(); return; }
  state.loading=true; render();
  const { data, error } = await supabaseClient.auth.signUp({ email, password, options:{ data:{ name } } });
  state.loading=false;
  if(error){ state.authError = error.message; render(); return; }
  if(data.session){ state.session = data.session; await loadUserData(); }
  else { state.authMsg='Account बन गया! कृपया अपना email verify करें, फिर login करें।'; state.page='login'; render(); }
}
async function doForgot(email){
  if(!email){ state.authError='Email भरें'; render(); return; }
  state.loading=true; state.authError=''; render();

  state.authMsg='Password reset link आपके email पर भेज दिया गया है।';

}

async function loadUserData(){
  state.loading = true; render();
  try{
    const uid = state.session.user.id;
    let { data: profile } = await supabaseClient.from('profiles').select('*, roles(name)').eq('id', uid).single();
    if(!profile){
      // profile row might not exist yet (trigger race) - create minimal
      await supabaseClient.from('profiles').insert({ id: uid, email: state.session.user.email, name: state.session.user.email.split('@')[0] });
      const r = await supabaseClient.from('profiles').select('*, roles(name)').eq('id', uid).single();
      profile = r.data;
    }
    state.profile = profile;
    await loadPermissions();
    await loadTowerSettings();
    await loadDutyPosts();
    await loadSocietySettings();
    await loadBroadcastAlerts();
    subscribeRealtime();
    if(state.profile.approval_status === 'rejected'){
      state.page = 'accessRejected';
    } else if(state.profile.must_change_password){
      state.page = 'forcePasswordChange';
    } else if(state.profile.approval_status !== 'approved' && !(state.profile.roles && state.profile.roles.name==='super_admin')){
      state.page = 'pendingApproval';
    } else {
      state.page = 'dashboard';
    }
  } catch(e){
    console.error(e);
    toast('Data load करने में समस्या: '+e.message, 'error');

async function loadPermissions(){
  state.permissions = new Set();
  if(!state.profile || !state.profile.role_id) return;
  if(state.profile.roles && state.profile.roles.name === 'super_admin'){
    ALL_PERMISSIONS.forEach(p=>state.permissions.add(p));
    return;
  }
  const { data: rolePerms } = await supabaseClient
    .from('role_permissions').select('permissions(key)').eq('role_id', state.profile.role_id);
  (rolePerms||[]).forEach(r=>{ if(r.permissions) state.permissions.add(r.permissions.key); });

  const { data: overrides } = await supabaseClient
    .from('user_permissions').select('permission_key, allowed').eq('user_id', state.profile.id);
  (overrides||[]).forEach(o=>{ if(o.allowed) state.permissions.add(o.permission_key); else state.permissions.delete(o.permission_key); });
}

function subscribeRealtime(){
  supabaseClient.channel('vehicles-realtime')
    .on('postgres_changes', { event:'*', schema:'public', table:'vehicles' }, ()=>{ 
      loadVehicles().then(render);
    })
    .subscribe();
  supabaseClient.channel('problems-realtime')
    .on('postgres_changes', { event:'*', schema:'public', table:'vehicle_problems' }, ()=>{
      loadProblems().then(render);
    })
    .subscribe();
  supabaseClient.channel('alerts-realtime')
    .on('postgres_changes', { event:'*', schema:'public', table:'vehicle_alerts' }, (payload)=>{
      const wasNewInsert = payload.eventType === 'INSERT';
      loadAlerts().then(()=>{
        render();
        if(wasNewInsert && payload.new && payload.new.reporter_id !== state.profile.id){
          toast('नई Alert आई है: '+payload.new.vehicle_number, 'error');
        }
      });
    })
    .subscribe();
  supabaseClient.channel('duty-sessions-realtime')
    .on('postgres_changes', { event:'*', schema:'public', table:'duty_sessions' }, (payload)=>{
      const row = payload.new || payload.old;
      if(state.page==='attendance' && row && row.guard_id === (state.attendanceGuardId || state.profile.id)){
        loadAttendance();
        if(row.guard_id === state.profile.id && payload.eventType !== 'INSERT'){
          toast('Admin ने आपकी Attendance में बदलाव किया है','info');
        }
      }
    })
    .subscribe();
  supabaseClient.channel('broadcast-alerts-realtime')
    .on('postgres_changes', { event:'*', schema:'public', table:'broadcast_alerts' }, (payload)=>{
      const wasNewInsert = payload.eventType === 'INSERT';
      loadBroadcastAlerts().then(()=>{
        render();
        if(wasNewInsert && payload.new && payload.new.raised_by !== state.profile.id){
          toast('🚨 '+payload.new.message, 'error');
        }
      });
    })
    .subscribe();
}

function loadDataForPage(p){
  if(p==='dashboard'){ loadVehicles(); loadProblems(); loadAlerts(); loadUsers(); if(isAdminRole()) loadApprovalsData(); }
  if(p==='vehicles') loadVehicles();
  if(p==='problems') loadProblems();
  if(p==='users') loadUsers();
  if(p==='alerts') loadAlerts();
  if(p==='approvals') loadApprovalsData();
  if(p==='attendance') loadAttendance();
  if(p==='settings') loadDutyPosts().then(render);
}

function bcastElapsed(startIso){
  const mins = Math.max(0, Math.round((new Date() - new Date(startIso))/60000));
  if(mins < 1) return 'अभी-अभी';
  if(mins < 60) return mins+' मिनट से चालू';
  return Math.floor(mins/60)+'घं '+(mins%60)+'मि से चालू';
}

async function approveVehicleRequest(id){
  const r = state.vehicleRequests.find(x=>x.id===id);
  if(!r) return;
  let opError = null;
  if(r.action === 'add'){
    const dup = await checkDuplicate(r.payload.vehicle_number);
    if(dup){ toast('यह Vehicle Number अब पहले से मौजूद है — Reject करें','error'); return; }
    const { error } = await supabaseClient.from('vehicles').insert({ ...r.payload, created_by: r.requested_by });
    opError = error;
  } else if(r.action === 'edit'){
    const dup = await checkDuplicate(r.payload.vehicle_number, r.vehicle_id);
    if(dup){ toast('यह Vehicle Number अब किसी और record में है — Reject करें','error'); return; }
    const { error } = await supabaseClient.from('vehicles').update({ ...r.payload, updated_at: new Date().toISOString() }).eq('id', r.vehicle_id);
    opError = error;
  } else if(r.action === 'delete'){
    const { error } = await supabaseClient.from('vehicles').delete().eq('id', r.vehicle_id);
    opError = error;
  }
  if(opError){ toast(opError.message,'error'); return; }
  await supabaseClient.from('vehicle_change_requests').update({ status:'approved', reviewed_by: state.profile.id, reviewed_at: new Date().toISOString() }).eq('id', id);
  toast('बदलाव approve करके लागू कर दिया गया','success');
  await loadApprovalsData();
  await loadVehicles();
}

}

/* ============================================================
   BULK ADD
============================================================ */
async function runBulkAdd(){
  const lines = state.bulkText.split('\n').map(l=>l.trim()).filter(Boolean);
  const added=[], duplicates=[], invalid=[];
  const seenInBatch = new Set();
  for(const line of lines){
    const parts = line.split(',').map(p=>p.trim());
    if(parts.length < 4){ invalid.push({line, reason:'गलत format (Tower,Floor,Flat,Vehicle चाहिए)'}); continue; }
    const [towerRaw, floorRaw, flat, vehicleRaw] = parts;
    const tower = towerRaw.toUpperCase();
    const t = getTower(tower);
    if(!t){ invalid.push({line, reason:'Tower मौजूद नहीं: '+tower}); continue; }
    const floors = buildFloors(t);
    const floorNorm = floorRaw.toLowerCase()==='ground' || floorRaw==='0' ? 'Ground' : String(parseInt(floorRaw,10));
    if(!floors.includes(floorNorm)){ invalid.push({line, reason:'Floor मौजूद नहीं: '+floorRaw}); continue; }
    const flats = buildFlats(t, floorNorm);
    if(!flats.includes(flat)){ invalid.push({line, reason:'Flat मौजूद नहीं: '+flat}); continue; }
    const vnum = normalizeVehicleNumber(vehicleRaw);
    if(!vnum){ invalid.push({line, reason:'Vehicle number खाली है'}); continue; }
    if(seenInBatch.has(vnum)){ duplicates.push({line, reason:'Batch में duplicate'}); continue; }
    const dup = await checkDuplicate(vnum);
    if(dup){ duplicates.push({line, reason:'Database में पहले से मौजूद'});
      await supabaseClient.from('vehicle_problems').insert({ vehicle_number:vnum, tower, floor:floorNorm, flat, reason:'Duplicate vehicle number (bulk import)', source:'bulk' });
      continue;
    }
    seenInBatch.add(vnum);
    added.push({ vehicle_number:vnum, tower, floor:floorNorm, flat, created_by: state.profile.id });
  }
  if(added.length){
    const { error } = await supabaseClient.from('vehicles').insert(added);
    if(error){ toast('कुछ records save नहीं हो पाए: '+error.message,'error'); }
  }
  state.bulkResult = { added: added.length, duplicates: duplicates.length, invalid };
  await loadVehicles();
  render();
}

/* ============================================================
   PDF IMPORT (heuristic extraction)
============================================================ */
async function runPdfImport(file){
  if(!file) return;
  state.pdfBusy = true; state.pdfResult = null; render();
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let lines = [];
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      let currentLine = ''; let lastY = null;
      content.items.forEach(item=>{
        const y = item.transform[5];
        if(lastY !== null && Math.abs(y-lastY) > 3){ lines.push(currentLine); currentLine=''; }
        currentLine += item.str + ' ';
        lastY = y;
      });
      if(currentLine.trim()) lines.push(currentLine);
    }
    const vehicleRegex = /\b[A-Z]{2}\s?-?\s?\d{1,2}\s?-?\s?[A-Z]{1,3}\s?-?\s?\d{4}\b/gi;
    const flatRegex = /\b\d{3,4}\b/g;
    const towerRegex = new RegExp('\\bTower\\s*[:\\-]?\\s*('+ALL_TOWER_CODES.join('|')+')\\b','i');

    const added=[], duplicates=[], invalid=[];
    for(const line of lines){
      const vMatches = line.match(vehicleRegex);
      if(!vMatches) continue;
      for(const vRaw of vMatches){
        const vnum = normalizeVehicleNumber(vRaw);
        const flatMatches = line.replace(vRaw,'').match(flatRegex);
        const towerMatch = line.match(towerRegex);
        if(!flatMatches || !flatMatches.length){
          invalid.push({ line, reason:'Flat number नहीं मिला', vehicle:vnum });
          await supabaseClient.from('vehicle_problems').insert({ vehicle_number:vnum, reason:'PDF: Flat number नहीं मिला', source:'pdf', raw_data:{line} });
          continue;
        }
        const flat = flatMatches[0].length===3 ? '0'+flatMatches[0] : flatMatches[0];
        let tower = towerMatch ? towerMatch[1].toUpperCase() : null;
        let floor = null;
        if(tower){
          const t = getTower(tower);
          const floors = t ? buildFloors(t) : [];
          for(const f of floors){ if(buildFlats(t,f).includes(flat)){ floor = f; break; } }
        } else {
          const candidates = findTowerFloorForFlat(flat);
          if(candidates.length === 1){ tower = candidates[0].tower; floor = candidates[0].floor; }
        }
        if(!tower || !floor){
          invalid.push({ line, reason:'Tower/Floor confirm नहीं हो पाया (flat ambiguous)', vehicle:vnum });
          await supabaseClient.from('vehicle_problems').insert({ vehicle_number:vnum, flat, reason:'PDF: Tower/Floor स्पष्ट नहीं है', source:'pdf', raw_data:{line} });
          continue;
        }
        const dup = await checkDuplicate(vnum);
        if(dup){
          duplicates.push({ line, vehicle:vnum });
          await supabaseClient.from('vehicle_problems').insert({ vehicle_number:vnum, tower, floor, flat, reason:'Duplicate vehicle number (PDF import)', source:'pdf' });
          continue;
        }
        const { error } = await supabaseClient.from('vehicles').insert({ vehicle_number:vnum, tower, floor, flat, created_by: state.profile.id });
        if(!error) added.push(vnum);
      }
    }
    state.pdfResult = { added: added.length, duplicates: duplicates.length, invalid };
    await loadVehicles();
  } catch(e){
    console.error(e);
    toast('PDF पढ़ने में समस्या हुई। कृपया दूसरी PDF try करें।','error');
    state.pdfResult = { added:0, duplicates:0, invalid:[{line:'-', reason: e.message}] };
  }
  state.pdfBusy = false;
  render();
}

let videoStreamRef = null;
async function startCamera(){
  state.cameraOn = true; state.cameraResult = null; render();
  try{
    videoStreamRef = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' } });
    const video = document.getElementById('camera-video');
    if(video){ video.srcObject = videoStreamRef; video.play(); }
  } catch(e){
    toast('Camera permission नहीं मिली','error');
    state.cameraOn = false; render();
  }
}
function stopCamera(){
  if(videoStreamRef){ videoStreamRef.getTracks().forEach(t=>t.stop()); videoStreamRef=null; }
  state.cameraOn = false; render();
}
async function captureAndScan(){
  const video = document.getElementById('camera-video');
  if(!video) return;
  state.cameraBusy = true; render();
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  try{
    const result = await Tesseract.recognize(canvas, 'eng');
    const text = result.data.text || '';
    const match = text.match(/[A-Z0-9]{6,12}/gi);
    const guess = match ? normalizeVehicleNumber(match.sort((a,b)=>b.length-a.length)[0]) : '';
    if(!guess){
      state.cameraResult = { ok:false, text: text.trim(), matches: [] };
    } else {
      const { data } = await supabaseClient.from('vehicles').select('*').ilike('vehicle_number', '%'+guess+'%');
      state.cameraResult = { ok:true, guess, matches: data || [] };
    }
  } catch(e){
    toast('OCR में समस्या हुई','error');
  }
  state.cameraBusy = false;
  render();
}

async function getEffectivePermsForUser(user){
  if(user.roles && user.roles.name==='super_admin') return new Set(ALL_PERMISSIONS);
  const { data: rolePerms } = await supabaseClient.from('role_permissions').select('permissions(key)').eq('role_id', user.role_id);
  const set = new Set((rolePerms||[]).map(r=>r.permissions && r.permissions.key).filter(Boolean));
  const { data: overrides } = await supabaseClient.from('user_permissions').select('permission_key,allowed').eq('user_id', user.id);
  const overrideMap = {};
  (overrides||[]).forEach(o=>{ overrideMap[o.permission_key]=o.allowed; if(o.allowed) set.add(o.permission_key); else set.delete(o.permission_key); });
  return { set, overrideMap };
}

async function toggleDuty(){
  if(state.profile.on_duty){
    const { error } = await supabaseClient.from('profiles').update({ on_duty: false, duty_since: null }).eq('id', state.profile.id);
    if(error){ toast(error.message,'error'); return; }
    state.profile.on_duty = false;
    await supabaseClient.from('duty_sessions').update({ end_time: new Date().toISOString() }).eq('guard_id', state.profile.id).is('end_time', null);
    await supabaseClient.from('activity_logs').insert({ user_id: state.profile.id, action: 'duty_off' });
    toast('आपकी Duty खत्म हो गई','info');
    render();
    return;
  }
  await openDutyTowerModal();
}
async function openDutyTowerModal(){
  const { data: onDutyGuards } = await supabaseClient.from('profiles').select('tower').eq('on_duty', true);
  const counts = {};
  (onDutyGuards||[]).forEach(g=>{ if(g.tower) counts[g.tower] = (counts[g.tower]||0) + 1; });
  const root = document.getElementById('modal-root');
  const rowHtml = (label, code, cap) => {
    const c = counts[code] || 0;
    const full = c >= cap;
    return `
    <button ${full?'disabled':''} onclick="confirmDutyOn('${code}', ${cap})" class="w-full flex items-center justify-between px-4 py-3 rounded-xl border ${full?'bg-gray-50 border-gray-100 opacity-60':'bg-white border-gray-200 active:bg-blue-50'}">
      <span class="font-semibold text-slate-800">${label}</span>
      <span class="text-xs font-medium ${full?'text-rose-500':'text-emerald-600'}">${c}/${cap} Guards ${full?'(Full)':''}</span>
    </button>`;
  };
  root.innerHTML = `
    <div class="fixed inset-0 bg-black/40 z-[90] flex items-end sm:items-center justify-center" onclick="if(event.target===event.currentTarget)document.getElementById('modal-root').innerHTML=''">
      <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 fade-in">
        <div class="flex items-start gap-3 mb-3">
          <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">${icon('building','w-5 h-5')}</div>
          <div>
            <p class="font-semibold text-slate-900">आज आप कहाँ Duty पर हैं?</p>
            <p class="text-sm text-slate-500 mt-1">हर जगह की एक तय Guard limit है</p>
          </div>
        </div>
        <div class="space-y-3 max-h-96 overflow-y-auto">
          <div>
            <p class="text-[11px] font-semibold text-slate-400 mb-1.5">TOWER</p>
            <div class="space-y-2">
              ${state.towers.map(t => rowHtml('Tower '+t.tower_code, t.tower_code, 2)).join('')}
            </div>
          </div>
          ${state.dutyPosts.length ? `
          <div>
            <p class="text-[11px] font-semibold text-slate-400 mb-1.5">अन्य Post (बिना Tower)</p>
            <div class="space-y-2">
              ${state.dutyPosts.map(p => rowHtml(p.name, p.name, p.max_guards)).join('')}
            </div>
          </div>` : ''}
        </div>
        <button class="w-full mt-4 py-2.5 rounded-xl bg-gray-100 text-slate-700 font-medium text-sm" onclick="document.getElementById('modal-root').innerHTML=''">Cancel</button>
      </div>
    </div>`;
}
async function confirmDutyOn(code, cap){
  cap = cap || 2;
  const { data: onDutyGuards } = await supabaseClient.from('profiles').select('id').eq('on_duty', true).eq('tower', code);
  if((onDutyGuards||[]).length >= cap){
    toast('यहाँ पहले से Guard limit पूरी है। कृपया कोई और जगह चुनें।','error');
    await openDutyTowerModal();
    return;
  }
  const { error } = await supabaseClient.from('profiles').update({ on_duty: true, tower: code, duty_since: new Date().toISOString() }).eq('id', state.profile.id);
  document.getElementById('modal-root').innerHTML = '';
  if(error){ toast(error.message,'error'); return; }
  state.profile.on_duty = true;
  state.profile.tower = code;
  await supabaseClient.from('duty_sessions').insert({ guard_id: state.profile.id, tower: code, start_time: new Date().toISOString() });
  await supabaseClient.from('activity_logs').insert({ user_id: state.profile.id, action: 'duty_on', details:{ tower: code } });
  toast('आप अब '+dutyPostLabel(code)+' की Duty पर हैं','success');
  render();
}

function toDatetimeLocal(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}

async function submitSessionModal(sessionId, guardId){
  const place = document.getElementById('sess-place').value;
  const startVal = document.getElementById('sess-start').value;
  const endVal = document.getElementById('sess-end').value;
  if(!startVal){ toast('Start Time भरें','error'); return; }
  const payload = {
    tower: place,
    start_time: new Date(startVal).toISOString(),
    end_time: endVal ? new Date(endVal).toISOString() : null
  };
  let error;
  if(sessionId){
    ({ error } = await supabaseClient.from('duty_sessions').update(payload).eq('id', sessionId));
  } else {
    ({ error } = await supabaseClient.from('duty_sessions').insert({ ...payload, guard_id: guardId }));
  }
  document.getElementById('modal-root').innerHTML = '';
  if(error){ toast(error.message,'error'); return; }
  toast('Attendance save हो गई','success');
  await loadAttendance();
}
function deleteDutySession(id){
  confirmDialog('इस Attendance Entry को हटाना चाहते हैं?', async ()=>{
    const { error } = await supabaseClient.from('duty_sessions').delete().eq('id', id);
    if(error){ toast(error.message,'error'); return; }
    toast('Entry हटा दी गई','success');
    await loadAttendance();
  });
}
function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('hi-IN', { hour:'2-digit', minute:'2-digit' });
}
function fmtDuration(startIso, endIso){
  const start = new Date(startIso);
  const end = endIso ? new Date(endIso) : new Date();
  const mins = Math.max(0, Math.round((end - start) / 60000));
  const h = Math.floor(mins/60), m = mins%60;
  return h>0 ? (h+'घं '+m+'मि') : (m+'मि');
}
function renderAttendance(){
  const days = [];
  const cursor = new Date();
  cursor.setHours(0,0,0,0);
  for(let i=0;i<183;i++){
    const d = new Date(cursor);
    d.setDate(d.getDate() - i);
    const dayStart = new Date(d); dayStart.setHours(0,0,0,0);
    const dayEnd = new Date(d); dayEnd.setHours(23,59,59,999);
    const sessions = state.attendance.filter(s => {
      const st = new Date(s.start_time);
      return st >= dayStart && st <= dayEnd;
    });
    days.push({ date: d, sessions });
  }
  const totalDutyDays = days.filter(x=>x.sessions.length).length;
  const totalMinutes = state.attendance.reduce((sum,s)=>{
    const start = new Date(s.start_time);
    const end = s.end_time ? new Date(s.end_time) : new Date();
    return sum + Math.max(0,(end-start)/60000);
  }, 0);
  const totalHours = Math.round(totalMinutes/60);

  const months = [];
  const monthIndex = {};
  days.forEach(d => {
    const key = d.date.getFullYear()+'-'+d.date.getMonth();
    if(!(key in monthIndex)){
      monthIndex[key] = months.length;
      months.push({ key, label: d.date.toLocaleDateString('hi-IN', { month:'long', year:'numeric' }), days: [] });
    }
    months[monthIndex[key]].days.push(d);
  });
  if(state.attendanceOpenMonth === undefined) state.attendanceOpenMonth = months.length ? months[0].key : null;

  return `

        <div class="bg-white rounded-2xl p-3 text-center shadow-[0_2px_12px_rgba(15,23,42,0.06)] border border-gray-50"><p class="text-lg font-bold text-rose-500">${183-totalDutyDays}</p><p class="text-[10px] text-slate-400">छुट्टी वाले दिन</p></div>
      </div>
      <div class="space-y-3">
        ${!state.attendanceLoaded ? skeletonCards(4) : months.map(m => {
          const monthDutyDays = m.days.filter(x=>x.sessions.length).length;
          const open = state.attendanceOpenMonth === m.key;
          return `
          <div class="bg-white rounded-2xl shadow-[0_2px_12px_rgba(15,23,42,0.06)] border border-gray-50 overflow-hidden">
            <button onclick="state.attendanceOpenMonth = state.attendanceOpenMonth==='${m.key}' ? null : '${m.key}'; render()" class="w-full flex items-center justify-between px-4 py-3.5">
              <span class="font-bold text-slate-900">${m.label}</span>
              <span class="flex items-center gap-2">
                <span class="text-[11px] px-2 py-1 rounded-full bg-emerald-50 text-emerald-600 font-medium">${monthDutyDays} Duty Days</span>
                <span class="text-slate-400 transition ${open?'rotate-90':''}">${icon('chevron','w-4 h-4')}</span>
              </span>
            </button>
            ${open ? `<div class="px-3 pb-3 space-y-2">
              ${m.days.map(d => {
                const dateLabel = d.date.toLocaleDateString('hi-IN', { day:'2-digit', month:'short', weekday:'short' });
                const dateISO = d.date.getFullYear()+'-'+String(d.date.getMonth()+1).padStart(2,'0')+'-'+String(d.date.getDate()).padStart(2,'0');
                const canEdit = hasPerm('manage_users');
                if(!d.sessions.length){
                  return `<div class="flex items-center justify-between bg-gray-50 rounded-xl px-4 py-2.5">

async function submitForcePasswordChange(){
  const p1 = document.getElementById('fpc-new').value;
  const p2 = document.getElementById('fpc-confirm').value;
  if(!p1 || p1.length < 6){ toast('Password कम से कम 6 अक्षर का हो','error'); return; }
  if(p1 !== p2){ toast('Password मेल नहीं खाता','error'); return; }
  state.loading = true; render();
  const { error } = await supabaseClient.auth.updateUser({ password: p1 });
  if(error){ state.loading=false; toast(error.message,'error'); render(); return; }
  await supabaseClient.from('profiles').update({ must_change_password:false }).eq('id', state.profile.id);
  state.profile.must_change_password = false;
  state.loading = false;
  toast('Password बदल दिया गया','success');
  if(state.profile.approval_status === 'approved' || (state.profile.roles && state.profile.roles.name==='super_admin')){
    state.page = 'dashboard'; render(); loadDataForPage('dashboard');
  } else {
    state.page = 'pendingApproval'; render();
  }
}

let userDetailPerms = null;

  const u = state.users.find(x=>x.id===state.selectedUserId);

        <p class="text-xs font-semibold text-slate-500 mb-2">Permissions</p>

    <div class="p-4 space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-[0_2px_12px_rgba(15,23,42,0.06)] border border-gray-50 flex justify-around text-center">
        <div><p class="text-lg font-bold text-emerald-600">${withParking.length}</p><p class="text-[10px] text-slate-400">Parking Assigned</p></div>
        <div><p class="text-lg font-bold text-rose-600">${withoutParking.length}</p><p class="text-[10px] text-slate-400">No Parking</p></div>
      </div>
      <p class="text-sm font-semibold text-slate-700">Parking List (क्रमानुसार)</p>
      ${!state.vehiclesLoaded ? skeletonCards(3) : (withParking.length ? withParking.map(vehicleCard).join('') : emptyState('कोई parking assign नहीं है'))}
    </div>
    ${bottomNav()}
  `;
}
function renderProfileEdit(){
  const f = state.profileForm;
  return `
    ${header('Edit Profile', { back:"setPage('profile')" })}
    <div class="p-4 space-y-3">
      <div class="bg-white rounded-2xl p-4 shadow-[0_2px_12px_rgba(15,23,42,0.06)] border border-gray-50 space-y-3">
        <input value="${f.name||''}" oninput="state.profileForm.name=this.value" placeholder="Name" class="w-full px-3 py-3 rounded-xl border border-gray-200 bg-white text-sm">
        <input value="${f.mobile||''}" oninput="state.profileForm.mobile=this.value" placeholder="Mobile" class="w-full px-3 py-3 rounded-xl border border-gray-200 bg-white text-sm">
        <div class="px-3 py-3 rounded-xl bg-gray-50 text-sm text-slate-500">Tower: <b class="text-slate-700">${f.tower || 'अभी set नहीं है'}</b><br><span class="text-xs">Tower बदलने के लिए Duty ON/OFF वाला बटन इस्तेमाल करें</span></div>
      </div>
      <button onclick="submitProfileEdit()" class="w-full py-3.5 rounded-xl bg-blue-600 text-white font-semibold shadow-md shadow-blue-200 active:scale-[0.98] transition">Save Profile</button>
    </div>
  `;
}

/* ============================================================
   MAIN RENDER SWITCH
============================================================ */
function render(){
  const app = document.getElementById('app');
  if(state.loading && !state.profile){
    app.innerHTML = `<div class="min-h-screen flex items-center justify-center">${icon('car','w-8 h-8 text-blue-500 spin')}</div>`;
    return;
  }
  if(!state.session){
    if(state.page==='config') { app.innerHTML = renderConfigScreen(); return; }
    if(state.page==='onboarding') { app.innerHTML = renderOnboarding(); return; }
    if(state.page==='register') { app.innerHTML = renderRegister(); return; }
    if(state.page==='forgot') { app.innerHTML = renderForgot(); return; }
    app.innerHTML = renderLogin();
    return;
  }
  if(!state.profile){
    app.innerHTML = `<div class="min-h-screen flex items-center justify-center">${icon('car','w-8 h-8 text-blue-500 spin')}</div>`;
    return;
  }
  if(state.page==='pendingApproval'){ app.innerHTML = renderPendingApproval(); return; }
  if(state.page==='forcePasswordChange'){ app.innerHTML = renderForcePasswordChange(); return; }
  if(state.page==='accessRejected'){ app.innerHTML = renderAccessRejected(); return; }
  let html = '';
  switch(state.page){
    case 'vehicles': html = renderVehicles(); break;
    case 'addVehicle': html = renderAddVehicle(); break;
    case 'editVehicle': html = renderEditVehicle(); break;
    case 'viewVehicle': html = renderViewVehicle(); break;
    case 'adminPanel': html = renderAdminPanel(); break;
    case 'reports': html = renderReports(); break;
    case 'parkingOverview': html = renderParkingOverview(); break;
    case 'problems': html = renderProblems(); break;
    case 'alerts': html = renderAlerts(); break;
    case 'approvals': html = renderApprovals(); break;
    case 'attendance': html = renderAttendance(); break;
    case 'bulkAdd': html = renderBulkAdd(); break;
    case 'pdfImport': html = renderPdfImport(); break;
    case 'camera': html = renderCamera(); break;
    case 'users': html = renderUsers(); break;
    case 'userDetail': html = renderUserDetail(); break;
    case 'settings': html = renderSettings(); break;
    case 'profile': html = renderProfile(); break;
    case 'profileEdit': html = renderProfileEdit(); break;
    default: html = renderDashboard();
  }
  app.innerHTML = html;
  if(state.page==='vehicles' && state.searchFocus){
    state.searchFocus = false;
    const inp = document.getElementById('vehicle-search-input');
    if(inp) inp.focus();
  }
}

// keep editingVehicle page in sync
const _origSetPage = setPage;

document.addEventListener('DOMContentLoaded', () => {
  if(state.editingVehicle){ /* no-op placeholder */ }
  initAuth();
  // PWA service workers are not needed inside a native Capacitor/WebView APK.
  // Skipping registration there avoids WebView-origin related fetch failures.
  const isNativeShell = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if(!isNativeShell && 'serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker:', err));
  }
});
// route editVehicle page when openEditVehicle is called
const _openEditVehicle = openEditVehicle;
openEditVehicle = function(id){ _openEditVehicle(id); state.page = 'editVehicle'; render(); };

</script>
